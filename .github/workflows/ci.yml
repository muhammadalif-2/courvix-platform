name: Validate Courvix
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --include=dev --include=optional
      - run: npx tsc --noEmit
      - run: npm test
      - run: npm run build
      - run: npm run release:check
